<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de contacto</title>
    <link rel="stylesheet" href="/../public/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1><a href="../index.html">RecoCyc</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="tipos.html">Tipos</a></li>
                    <li><a href="accesorios.html">Accesorios</a></li>
                    <li><a href="marcas.html">Marcas</a></li>
                    <li><a href="recomendaciones.html">Recomendaciones</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section>
            <p>
                Si tienes alguna pregunta, sugerencia o simplemente quieres ponerte en contacto con nosotros, no dudes en enviarnos un correo electrónico a <a href="mailto:a.pardo@sapalomera.cat?subject=Consulta desde la página web">cyclismers@gmail.com</a>. Estaremos encantados de ayudarte en todo lo que necesites.
            </p>
    </section>
    <section>
        <form id="contactForm">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const subject = 'Consulta desde la página web';
            const body = `Nombre: ${name}\nCorreo: ${email}\nMensaje: ${message}`;
            window.location.href = `mailto:a.pardo@sapalomera.cat?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
    </script>
</body>
</html>
